# DogLens training configuration (baseline values).
seed: 42
device: auto            # auto | cpu | cuda | mps ; explicit device must work or fail
precision: float32

data:
  manifest: data/prepared/manifest.csv
  image_root: data/images/Images
  val_fraction: 0.2     # stratified hold-out from the official train split
  bbox_context: 0.1     # extra context added on every side of the largest valid bbox

loader:
  batch_size: 16
  num_workers: 0

model:
  architecture: efficientnet_b0
  pretrained_weights: IMAGENET1K_V1
  num_classes: 120

pretrained:             # local copy, verified by SHA-256; see data/weights/SOURCE.json
  path: data/weights/efficientnet_b0_rwightman-7f5810bc.pth
  sha256: 7f5810bc96def8f7552d5b7e68d53c4786f81167d28291b21c0d90e1fca14934
  weights_enum: EfficientNet_B0_Weights.IMAGENET1K_V1

augment:                # train only; applied before the shared deterministic preprocessing
  horizontal_flip: true

smoke:                  # scripts/train.py --smoke-test (pipeline check, not a quality measure)
  per_class: 2          # images per class from the train split (240 total)
  train_batches: 15
  overfit_batch_size: 16
  overfit_steps: 40
  overfit_lr: 0.01
  overfit_max_loss_ratio: 0.5   # last overfit loss must be < ratio * first loss
  finetune_steps: 2

optimizer:
  name: AdamW
  weight_decay: 0.0001

stage_a:                # frozen backbone, classifier only; backbone BatchNorm stays in eval
  epochs: 3
  lr: 0.001

stage_b:                # fine-tuning of the explicitly listed blocks with a fresh optimizer
  epochs: 5
  lr: 0.0001
  unfreeze_blocks: ["features.6", "features.7", "features.8"]
  batchnorm_policy: frozen   # frozen: all BatchNorm layers stay in eval mode | train_unfrozen

early_stopping_patience: 3

output:
  run_dir: artifacts/runs
  bundle_dir: artifacts/model_bundle
  smoke_dir: artifacts/smoke
