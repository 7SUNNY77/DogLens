[project]
name = "doglens"
version = "0.1.0"
description = "DogLens MVP: top-3 visually similar Stanford Dogs breeds for a user-selected region of a photo."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "streamlit>=1.38",
    "pillow>=10.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doglens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not integration\""
markers = [
    "integration: requires the real trained model bundle or dataset; skipped when unavailable",
]
filterwarnings = ["error::PIL.Image.DecompressionBombWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "artifacts", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
